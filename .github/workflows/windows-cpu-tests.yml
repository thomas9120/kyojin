# CPU-only tests on Windows: the parts of the tree that must not depend on a GPU build.
#
# These cover the platform-gating fixes the Windows port needed (early /health listener, socket
# shutdown semantics, serve logging, the draft policy, the n-gram index and its host row cache) and
# need no extension, no HIP toolchain and no GPU. The engine step additionally runs the pure-Python
# engine itself (row cache, page table, expert store, spec gate, disk store, job scheduling) with an
# kernel-free extension stub, so a regression in the code this port touched is visible in CI instead of
# only on a GPU box. The extension compile check is the separate, dispatch-only windows-rocm-build.yml.
name: CPU tests (Windows)

on:
  push:
    paths:
      - "tools/**.py"
      - "tools/gui/**"
      - "tools/windows/**.ps1"
      - "*-windows.bat"
      - "launch-gui.bat"
      - "exllamav3/**.py"
      - "tests/**.py"
      - ".github/workflows/windows-cpu-tests.yml"
      - ".gitattributes"
  pull_request:
    paths:
      - "tools/**.py"
      - "tools/gui/**"
      - "tools/windows/**.ps1"
      - "*-windows.bat"
      - "launch-gui.bat"
      - "exllamav3/**.py"
      - "tests/**.py"
      - ".github/workflows/windows-cpu-tests.yml"
      - ".gitattributes"
  workflow_dispatch:

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # CPU torch: these tests import exllamav3 for its pure-Python helpers only
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy aiohttp pytest psutil typing_extensions
          # Imported by the engine package even when its compiled extension is stubbed.
          python -m pip install "pydantic>=2" rich "tokenizers>=0.21.1" pillow triton-windows

      - name: Compile every module (catches syntax and import-time typos cheaply)
        run: python -m compileall -q exllamav3 tools tests

      - name: Launcher tests (no GPU)
        run: python -m unittest discover -s tests -p test_gui_launcher.py -v

      # These never import exllamav3, so they need neither a build nor the stub below.
      - name: Tool tests
        shell: bash
        run: >-
          python -m pytest -q
          tools/test_startup_health.py
          tools/test_serve_logging.py
          tools/qwen/test_guard.py
          tools/qwen/test_spec_rule.py
          tools/qwen/test_lookup_gate.py
          tests/test_shared_tool_copies.py
          --basetemp="$RUNNER_TEMP/pytest"

      # Importing exllamav3 asks ext.py for a precompiled extension and, finding none, starts a JIT
      # build (torch cpp_extension: needs a CUDA/HIP toolchain, minutes of compile). EXL3_TEST_STUB_EXT
      # registers a kernel-free exllamav3_ext in sys.modules first (tests/conftest.py), which takes the
      # precompiled branch. The stub has no kernels, so the list below is exactly the set of tests
      # that reach pure Python only -- a kernel call fails with AttributeError. Anything that needs a
      # model, a GPU or real kernels (test_kv_quant, test_gated_delta_rule, test_multimodal_*,
      # test_sampler, test_generator_max_new_tokens_, tools/qwen/test_ngram_index.py, ...) stays out.
      - name: Engine tests (CPU, stubbed extension)
        shell: bash
        env:
          EXL3_TEST_STUB_EXT: "1"
        run: >-
          python -m pytest -q
          tests/test_ngram_row_cache.py
          tests/test_expert_store_cpu.py
          tests/test_expert_store_mixedk_cpu.py
          tests/test_expert_store_prefetch_cpu.py
          tests/test_expert_store_prefill_overlap_cpu.py
          tests/test_expert_store_protect_cpu.py
          tests/test_prefill_block_table_cpu.py
          tests/test_spec_gate_cpu.py
          tests/test_spec_sample.py
          tests/test_failure_containment.py
          tests/test_disk_store_cpu.py
          tests/test_hip_lib.py
          tests/test_bench_rocm_cpu.py
          tests/test_bench_gpu_target_cpu.py
          tests/test_hip_compiler_cpu.py
          --basetemp="$RUNNER_TEMP/pytest-engine"

      # Line endings: the tree is LF, and a CRLF commit breaks the shell scripts and the sed-based
      # tooling (and hides the real change behind a whole-file diff).
      - name: No CRLF in tracked text
        run: python tools/windows/check_eol.py
